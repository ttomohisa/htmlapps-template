name: Deploy PR preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.135.0"

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Check Cloudflare preview credentials
        id: cloudflare
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -and
            -not [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)

          "configured=$($configured.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (-not $configured) {
            Write-Host "::notice::Cloudflare PR Preview skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not configured."
          }

      - name: Create or update Cloudflare Preview
        id: preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $env:CLOUDFLARE_API_TOKEN = $env:CLOUDFLARE_API_TOKEN.Trim()
          $env:CLOUDFLARE_ACCOUNT_ID = $env:CLOUDFLARE_ACCOUNT_ID.Trim()

          if ($env:CLOUDFLARE_ACCOUNT_ID -notmatch '^[A-Za-z0-9_-]+
          $output = & npx --yes "wrangler@$env:WRANGLER_VERSION" preview `
            --config wrangler.preview.jsonc `
            --name $previewName `
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" `
            --json

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Preview deployment failed."
          }

          $result = (($output -join [Environment]::NewLine) | ConvertFrom-Json)
          $previewUrl = [string]$result.preview.urls[0]

          if ([string]::IsNullOrWhiteSpace($previewUrl)) {
            throw "Wrangler did not return a Preview URL."
          }

          "preview_url=$previewUrl" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preview_name=$previewName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Preview URL: $previewUrl"

      - name: Probe Preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          $lastError = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $env:PREVIEW_URL -MaximumRedirection 5 -TimeoutSec 30

              if ($response.StatusCode -eq 200) {
                Write-Host "Preview returned HTTP 200."
                exit 0
              }

              $lastError = "HTTP $($response.StatusCode)"
            } catch {
              $lastError = $_.Exception.Message
            }

            Write-Host "Preview is not ready yet (attempt $attempt/12): $lastError"
            Start-Sleep -Seconds 5
          }

          throw "Preview did not become ready: $lastError"

      - name: Comment Preview URL
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview_name }}
        run: |
          $body = @"
          ## Browser Kitty PR Preview

          **[Previewを開く]($env:PREVIEW_URL)**

          - Preview: ``$env:PREVIEW_NAME``
          - Commit: ``${{ github.event.pull_request.head.sha }}``
          - Hosting: Cloudflare Workers Preview

          このPRへ追加でpushすると同じPreview URLが最新版へ更新されます。PRを閉じるとPreviewは自動削除されます。
          "@

          gh pr comment "${{ github.event.pull_request.number }}" `
            --body $body `
            --edit-last `
            --create-if-none

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Cloudflare preview credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Preview cleanup skipped because credentials are not configured."
          fi

      - name: Delete Cloudflare Preview
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          PREVIEW_NAME="r${{ github.event.repository.id }}-pr-${{ github.event.pull_request.number }}"

          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::warning::Cloudflare Preview cleanup skipped because CLOUDFLARE_ACCOUNT_ID contains invalid characters."
            exit 0
          fi

          if ! npx --yes "wrangler@${WRANGLER_VERSION}" preview delete \
            --config wrangler.preview.jsonc \
            --name "$PREVIEW_NAME" \
            --skip-confirmation; then
            echo "::warning::Cloudflare Preview '$PREVIEW_NAME' could not be deleted (it may already be absent)."
          fi
) {
            throw "CLOUDFLARE_ACCOUNT_ID contains invalid characters. Save only the Account ID value in the GitHub secret, without quotes or extra text."
          }

          $previewName = "r${{ github.event.repository.id }}-pr-${{ github.event.pull_request.number }}"
          Write-Host "Preview name: $previewName"

          $output = & npx --yes "wrangler@$env:WRANGLER_VERSION" preview `
            --config wrangler.preview.jsonc `
            --name $previewName `
            --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}" `
            --json

          if ($LASTEXITCODE -ne 0) {
            throw "Cloudflare Preview deployment failed."
          }

          $result = (($output -join [Environment]::NewLine) | ConvertFrom-Json)
          $previewUrl = [string]$result.preview.urls[0]

          if ([string]::IsNullOrWhiteSpace($previewUrl)) {
            throw "Wrangler did not return a Preview URL."
          }

          "preview_url=$previewUrl" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preview_name=$previewName" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Preview URL: $previewUrl"

      - name: Probe Preview
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          $lastError = $null

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $env:PREVIEW_URL -MaximumRedirection 5 -TimeoutSec 30

              if ($response.StatusCode -eq 200) {
                Write-Host "Preview returned HTTP 200."
                exit 0
              }

              $lastError = "HTTP $($response.StatusCode)"
            } catch {
              $lastError = $_.Exception.Message
            }

            Write-Host "Preview is not ready yet (attempt $attempt/12): $lastError"
            Start-Sleep -Seconds 5
          }

          throw "Preview did not become ready: $lastError"

      - name: Comment Preview URL
        if: steps.cloudflare.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_NAME: ${{ steps.preview.outputs.preview_name }}
        run: |
          $body = @"
          ## Browser Kitty PR Preview

          **[Previewを開く]($env:PREVIEW_URL)**

          - Preview: ``$env:PREVIEW_NAME``
          - Commit: ``${{ github.event.pull_request.head.sha }}``
          - Hosting: Cloudflare Workers Preview

          このPRへ追加でpushすると同じPreview URLが最新版へ更新されます。PRを閉じるとPreviewは自動削除されます。
          "@

          gh pr comment "${{ github.event.pull_request.number }}" `
            --body $body `
            --edit-last `
            --create-if-none

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check Cloudflare preview credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare Preview cleanup skipped because credentials are not configured."
          fi

      - name: Delete Cloudflare Preview
        if: steps.cloudflare.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PREVIEW_NAME="r${{ github.event.repository.id }}-pr-${{ github.event.pull_request.number }}"

          if ! npx --yes "wrangler@${WRANGLER_VERSION}" preview delete \
            --config wrangler.preview.jsonc \
            --name "$PREVIEW_NAME" \
            --skip-confirmation; then
            echo "::warning::Cloudflare Preview '$PREVIEW_NAME' could not be deleted (it may already be absent)."
          fi
