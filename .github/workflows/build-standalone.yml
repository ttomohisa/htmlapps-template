name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "components/**"
      - "app.config.json"
      - "assets/**"
      - "htmlapps-template.zip"
      - "**/*.md"
      - "README-FIRST.txt"
      - "schemas/app-config.schema.json"
      - "dependencies.json"
      - "dependencies.lock.json"
      - "schemas/dependencies*.json"
      - ".github/workflows/dependency-updates.yml"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - "scripts/build-self-extract.ps1"
      - "scripts/verify-self-extract.ps1"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Setup test tooling
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Release and component unit tests
        shell: pwsh
        run: |
          node --test tests/release.test.cjs tests/webrtc-scan-guide.test.mjs tests/webrtc-camera.test.mjs tests/webrtc-lifecycle.test.mjs tests/component-contracts.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed.' }

      - name: Install browser test tooling
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed.' }
          npx playwright install chromium firefox webkit
          if ($LASTEXITCODE -ne 0) { throw 'Browser install failed.' }

      - name: Cross-browser regression tests
        shell: pwsh
        run: |
          foreach ($engine in @('chromium','firefox','webkit')) {
            $env:BK_BROWSER = $engine
            foreach ($test in @('tests/starter-layout.browser.cjs','tests/starter-behavior.browser.cjs','tests/components.browser.cjs')) {
              node $test
              if ($LASTEXITCODE -ne 0) { throw "$engine regression failed: $test" }
            }
          }

      - name: Verify template source ZIP
        if: github.repository == 'ttomohisa/htmlapps-template'
        shell: pwsh
        run: |
          python scripts/package-template-source.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Template ZIP differs from tracked sources.' }

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            *.html
            dist/index.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
          retention-days: 14
