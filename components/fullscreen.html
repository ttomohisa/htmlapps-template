<!-- Native fullscreen when supported, in-page expanded dialog otherwise. No orientation lock. -->
<style>.bk-fullscreen-button{display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:44px;padding:8px 12px;border:1px solid var(--line,#d8dfdb);border-radius:9px;background:var(--surface,#fff);font:inherit;cursor:pointer}.bk-fullscreen-button svg{width:18px;height:18px}.bk-fullscreen-dialog{width:100%;height:100%;max-width:none;max-height:none;border:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--surface,#fff);color:inherit}.bk-fullscreen-dialog[open]{display:flex;flex-direction:column}.bk-fullscreen-dialog::backdrop{background:#0009}.bk-fullscreen-dialog [data-fullscreen-slot]{flex:1;min-height:0;overflow:auto}.bk-fullscreen-dialog button{align-self:flex-end}</style>
<button class="bk-fullscreen-button" type="button" data-expand aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6"/></svg><span data-i18n="fullscreen">全画面</span></button>
<dialog class="bk-fullscreen-dialog" data-expanded-dialog aria-label="Expanded view"><button class="bk-fullscreen-button" type="button" data-exit data-i18n="close">閉じる</button><div data-fullscreen-slot></div></dialog>
<script>
window.AppFullscreen=Object.freeze({mount({target,button,dialog,onChange=()=>{},onError=()=>{}}){
  const slot=dialog.querySelector('[data-fullscreen-slot]'),exit=dialog.querySelector('[data-exit]'),ctl=new AbortController();let anchor=null,busy=false,disposed=false,active=false;
  const update=()=>{const next=document.fullscreenElement===target||dialog.open;button.setAttribute('aria-pressed',String(next));if(next!==active){active=next;onChange(next);}};
  const restore=()=>{if(anchor){anchor.replaceWith(target);anchor=null;}update();if(button.isConnected)button.focus({preventScroll:true});};
  async function open(){if(busy||disposed||active)return;busy=true;try{if(target.requestFullscreen&&document.fullscreenEnabled){try{await target.requestFullscreen();if(disposed&&document.fullscreenElement===target)await document.exitFullscreen();update();return;}catch{if(disposed)return;}}anchor=document.createComment('fullscreen position');target.before(anchor);slot.append(target);try{dialog.showModal();}catch(error){restore();throw error;}update();}catch(error){onError(error);}finally{busy=false;}}
  async function close(){if(document.fullscreenElement===target){try{await document.exitFullscreen();}catch(error){onError(error);}}if(dialog.open)dialog.close();restore();}
  button.addEventListener('click',()=>{if(active)void close();else void open();},{signal:ctl.signal});exit.addEventListener('click',()=>void close(),{signal:ctl.signal});dialog.addEventListener('close',restore,{signal:ctl.signal});document.addEventListener('fullscreenchange',update,{signal:ctl.signal});update();
  return Object.freeze({open,close,async destroy(){disposed=true;ctl.abort();await close();}});
}});
</script>
