<!-- Compare two already-local, geometrically aligned images. App owns URLs and image dimensions. -->
<style>.bk-compare{display:grid;gap:8px;min-width:0}.bk-compare-stage{position:relative;overflow:hidden;isolation:isolate;border-radius:12px;background:#161a19;aspect-ratio:var(--compare-ratio,4/3)}.bk-compare-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.bk-compare-stage [data-after]{clip-path:inset(0 calc(100% - var(--compare-position,50%)) 0 0)}.bk-compare-line{position:absolute;left:var(--compare-position,50%);top:0;bottom:0;border-left:2px solid white;filter:drop-shadow(0 0 2px black);pointer-events:none}.bk-compare input{width:100%;min-height:44px;accent-color:var(--accent,#16624f)}.bk-compare-labels{display:flex;justify-content:space-between;gap:8px;font-size:12px}</style>
<div class="bk-compare"><div class="bk-compare-stage"><img data-before alt=""><img data-after alt=""><div class="bk-compare-line" aria-hidden="true"></div></div><label><span data-i18n="comparePosition">比較位置</span><input data-position type="range" min="0" max="100" value="50"></label><div class="bk-compare-labels"><span data-i18n="after">処理後</span><span data-i18n="before">処理前</span></div></div>
<script>
window.AppBeforeAfter=Object.freeze({mount(root,{onChange=()=>{}}={}){
  const stage=root.querySelector('.bk-compare-stage'),before=root.querySelector('[data-before]'),after=root.querySelector('[data-after]'),input=root.querySelector('[data-position]'),ctl=new AbortController();
  function set(value){if(!Number.isFinite(value))throw new TypeError('finite position required');input.value=Math.min(100,Math.max(0,value));stage.style.setProperty('--compare-position',input.value+'%');}
  input.addEventListener('input',()=>{set(input.valueAsNumber);onChange(input.valueAsNumber);},{signal:ctl.signal});set(50);
  return Object.freeze({set,setImages({beforeUrl,afterUrl,width,height,beforeAlt='',afterAlt=''}){if(!(width>0&&height>0&&Number.isFinite(width)&&Number.isFinite(height)))throw new RangeError('aligned image dimensions required');if(![beforeUrl,afterUrl].every(url=>typeof url==='string'&&/^(blob:|data:image\/)/i.test(url)))throw new TypeError('local image URLs required');stage.style.setProperty('--compare-ratio',width+' / '+height);before.alt=beforeAlt;after.alt=afterAlt;before.src=beforeUrl;after.src=afterUrl;},clear(){before.removeAttribute('src');after.removeAttribute('src');},destroy(){ctl.abort();before.removeAttribute('src');after.removeAttribute('src');}});
}});
</script>
