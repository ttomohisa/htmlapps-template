<!-- Explicit async phases. Localize messages supplied by the app; never fake progress. -->
<style>
.bk-progress{display:grid;gap:9px;padding:14px;border:1px solid var(--line,#d8dfdb);border-radius:12px;min-width:0}.bk-progress[hidden],.bk-progress [hidden]{display:none!important}.bk-progress progress{width:100%;accent-color:var(--accent,#16624f)}.bk-progress [data-message]{overflow-wrap:anywhere}.bk-progress[data-phase=error]{border-color:#b54545}.bk-progress button{min-height:44px;border:1px solid var(--line,#d8dfdb);border-radius:9px;background:transparent;padding:8px 12px;font:inherit;cursor:pointer}.bk-progress-actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
<section class="bk-progress" data-progress hidden>
  <strong data-title></strong><div data-message role="status" aria-live="polite"></div><progress data-meter aria-label="Progress" hidden></progress><span data-percent hidden></span>
  <div class="bk-progress-actions"><button type="button" data-cancel hidden data-i18n="cancel">キャンセル</button><button type="button" data-retry hidden data-i18n="retry">再試行</button></div>
</section>
<script>
window.AppProgressPanel=Object.freeze({mount(root){
  const q=s=>root.querySelector(s),meter=q('[data-meter]'),percent=q('[data-percent]'),cancel=q('[data-cancel]'),retry=q('[data-retry]'),ctl=new AbortController();let callbacks={},generation=0,disposed=false;
  function render({phase='idle',title='',message='',progress=null,onCancel,onRetry}={}){
    if(disposed)return;generation++;callbacks={onCancel,onRetry};root.dataset.phase=phase;root.hidden=phase==='idle';q('[data-title]').textContent=title;q('[data-message]').textContent=message;
    const processing=phase==='processing'||phase==='loading-runtime';meter.hidden=!processing;const known=processing&&Number.isFinite(progress);percent.hidden=!known;
    if(known){meter.max=1;meter.value=Math.min(1,Math.max(0,progress));percent.textContent=Math.round(meter.value*100)+'%';}else{meter.removeAttribute('value');percent.textContent='';}
    cancel.hidden=!processing||typeof onCancel!=='function';retry.hidden=phase!=='error'||typeof onRetry!=='function';cancel.disabled=retry.disabled=false;
  }
  function bind(button,key){button.addEventListener('click',async()=>{const fn=callbacks[key],id=generation;if(typeof fn!=='function'||button.disabled)return;button.disabled=true;try{await fn();}catch(error){if(id===generation&&!disposed){q('[data-message]').textContent=String(error?.message||error);}}finally{if(id===generation&&!disposed)button.disabled=false;}},{signal:ctl.signal});}
  bind(cancel,'onCancel');bind(retry,'onRetry');return Object.freeze({render,destroy(){disposed=true;generation++;ctl.abort();}});
}});
</script>
