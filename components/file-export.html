<!-- File output: app supplies the current validated result as a Blob. Sharing is optional. -->
<style>
.bk-export{display:grid;gap:8px;min-width:0}.bk-export label{display:grid;gap:5px;font-size:12px}.bk-export-name{display:flex;align-items:center;min-width:0;border:1px solid var(--line,#d8dfdb);border-radius:9px;padding-right:10px}.bk-export input{width:100%;min-width:0;border:0;background:transparent;padding:10px;font:inherit;min-height:44px}.bk-export-name span{color:var(--muted,#596762)}.bk-export-actions{display:flex;gap:8px;flex-wrap:wrap}.bk-export button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid var(--line,#d8dfdb);border-radius:9px;padding:9px 14px;background:var(--surface,#fff);font:inherit;cursor:pointer}.bk-export button[data-save]{background:var(--accent,#16624f);color:white}.bk-export button:disabled{opacity:.5;cursor:not-allowed}.bk-export svg{width:18px;height:18px;flex:none}.bk-export [hidden]{display:none!important}@media(max-width:520px){.bk-export-actions button{flex:1 1 120px}}
</style>
<div class="bk-export" data-file-export>
  <label><span data-i18n="outputFilename">出力ファイル名</span><span class="bk-export-name"><input data-name type="text" maxlength="120" autocomplete="off" spellcheck="false"><span data-extension aria-hidden="true"></span></span></label>
  <div class="bk-export-actions"><button type="button" data-save disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span data-i18n="save">保存</span></button><button type="button" data-share hidden disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v8h14v-8"/></svg><span data-i18n="share">共有</span></button></div>
  <div role="status" aria-live="polite" data-export-status></div>
</div>
<script>
window.AppFileExport=(()=>{
  function normalize(value,extension='txt',fallback='output'){
    const ext=String(extension).replace(/^\./,'').toLowerCase();if(!/^[a-z0-9]{1,12}$/.test(ext))throw new TypeError('invalid extension');
    const clean=s=>String(s??'').replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g,'-').trim().replace(/[. ]+$/g,'');
    let base=clean(value);if(base.toLowerCase().endsWith('.'+ext))base=base.slice(0,-ext.length-1).trim().replace(/[. ]+$/g,'');base=base||clean(fallback)||'output';
    if(/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(base))base+='-file';
    return Array.from(base).slice(0,120).join('').replace(/[. ]+$/g,'')+'.'+ext;
  }
  function mount(root,{extension='txt',defaultName='output',onResult=()=>{},onError=()=>{},onCancel=()=>{},allowShare=true}={}){
    const q=s=>root.querySelector(s),name=q('[data-name]'),save=q('[data-save]'),share=q('[data-share]'),suffix=q('[data-extension]'),status=q('[data-export-status]'),ctl=new AbortController(),urls=new Set();let blob=null,busy=false,disposed=false,generation=0;
    suffix.textContent='.'+extension.replace(/^\./,'');name.value=defaultName;
    const filename=()=>normalize(name.value,extension,defaultName),makeFile=()=>new File([blob],filename(),{type:blob.type||'application/octet-stream'});
    const canShare=()=>{try{return Boolean(allowShare&&blob&&navigator.share&&navigator.canShare?.({files:[makeFile()]}));}catch{return false;}};
    function refresh(){save.disabled=!blob||busy;share.hidden=!canShare();share.disabled=busy||!blob;}
    const report=(kind,error)=>{if(!disposed){if(kind==='error')onError(error,{status});else if(kind==='cancel')onCancel({status});else onResult(kind,{status});}};
    const release=url=>{URL.revokeObjectURL(url);urls.delete(url);};
    const download=()=>{if(!blob||busy||disposed)return;let anchor,url;try{url=URL.createObjectURL(blob);urls.add(url);anchor=document.createElement('a');anchor.href=url;anchor.download=filename();anchor.hidden=true;document.body.append(anchor);anchor.click();report('download-started');}catch(error){report('error',error);}finally{anchor?.remove();if(url)setTimeout(()=>release(url),60000);}};
    const sharing=async()=>{if(!canShare()||busy||disposed)return;const id=generation;busy=true;refresh();try{await navigator.share({files:[makeFile()]});if(id===generation)report('shared');}catch(error){if(id===generation)report(error?.name==='AbortError'?'cancel':'error',error);}finally{busy=false;if(!disposed)refresh();}};
    const listen=(el,event,fn)=>el.addEventListener(event,fn,{signal:ctl.signal});listen(save,'click',download);listen(share,'click',sharing);listen(name,'input',refresh);listen(window,'pagehide',()=>{for(const url of urls)release(url);});
    refresh();return Object.freeze({setResult(value){if(value!==null&&!(value instanceof Blob))throw new TypeError('Blob or null expected');generation++;blob=value;status.textContent='';refresh();},filename,download,destroy(){disposed=true;generation++;ctl.abort();for(const url of urls)release(url);blob=null;save.disabled=share.disabled=true;}});
  }
  return Object.freeze({normalize,mount});
})();
</script>
